name: CI

on:
  push:
  pull_request:

# Test-only, obviously-fake placeholder values — never real secrets. These
# exist solely so src/tests/unit/stripe-webhook-route.test.ts (part of the
# core job's `npm test`) can run without the gitignored .env.local: that
# test's readRealEnvValue() prefers an already-set process.env value before
# ever reading .env.local from disk, so setting these here is sufficient —
# no .env.local file needs to exist in this workflow at all. Every other
# job simply ignores these; nothing here is a real credential. Any REAL
# Stripe/Supabase key belongs in GitHub Secrets (Settings > Secrets and
# variables > Actions), referenced as ${{ secrets.NAME }} — never inlined
# in this file.
#
# NODE_VERSION: no .nvmrc or package.json "engines" field pins a Node
# version for this repo; 24 matches the version this project is developed
# and validated against. Update this (and this comment) together if that
# ever changes.
env:
  STRIPE_SECRET_KEY: sk_test_dummy_placeholder_not_a_real_key_00000000
  STRIPE_WEBHOOK_SECRET: whsec_dummy_placeholder_not_a_real_secret_0000
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_dummy_placeholder_not_a_real_key_0000
  STRIPE_PRICE_FAMILY_MONTHLY: price_dummy_placeholder_monthly_00000000
  STRIPE_PRICE_FAMILY_ANNUAL: price_dummy_placeholder_annual_000000000
  NODE_VERSION: "24"

jobs:
  # Infra-light, deterministic, and fast — this is the one required check.
  # Never touches Docker, a browser, or a real database, so it can't be
  # flaked by either of those (see the rls/e2e jobs below).
  core:
    name: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run validate:questions
      - run: npm run check:answers
      # Phase 1 exit gate, source side: every published item maps to exactly
      # one governed source (factory manifest or the curated bank), hashes
      # recompute, and the candidate/answer split holds. No database needed —
      # the projected-rows half runs in the `rls` job below, where one exists.
      - run: npm run projection:verify
      - run: npm test

  # Infra-heavy (Docker + a real local Postgres via the Supabase CLI) —
  # kept as its own job so a Docker-daemon hiccup or a slow container pull
  # can never flake the core signal above.
  rls:
    name: rls
    runs-on: ubuntu-latest
    # Matches the `db.port` in supabase/config.toml and tests/rls/db.ts's
    # DEFAULT_DB_URL. Set explicitly rather than defaulted inside the
    # projection script: that script WRITES, and a writer that silently picks
    # a connection string is the wrong kind of convenient.
    env:
      PROJECTION_DB_URL: postgresql://postgres:postgres@127.0.0.1:56322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Pinned (not "latest") for the same determinism reason everything
      # else in this workflow is pinned — validated locally against this
      # exact version.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.108.0
      # Applies every migration under supabase/migrations/ (including
      # 20260722100000_exam_attempts_unique_session_id.sql) to a fresh
      # local Postgres — see supabase/config.toml and
      # docs/RLS_TEST_PLAN.md's "How to run". tests/rls/db.ts connects to
      # this exact instance (postgresql://postgres:postgres@127.0.0.1:56322
      # by default, or RLS_TEST_DB_URL if set) — no separate "postgres:"
      # service container is used, because the RLS suite impersonates
      # Supabase's own `anon`/`authenticated` roles and calls `auth.uid()`,
      # neither of which exists on a vanilla Postgres image; only the real
      # Supabase local stack provisions them.
      - run: supabase start
      # The mindmosaic_scoring role (spec §9.3.1) is created by
      # 20260812110000 with LOGIN and no password, deliberately: a migration is
      # committed and a credential must not be. tests/rls connects as that role
      # for real rather than impersonating it, so it needs one. Local-only
      # value; production sets SCORING_DB_PASSWORD from its secret store.
      - run: npm run scoring:bootstrap
      # Spec §22's "fresh apply plus live object verification", and DoD item 4.
      # `supabase start` above has just applied every migration to an empty
      # database, so this is the only place the registry can be checked against
      # a database whose state nobody has nudged by hand. `record` runs each
      # entry's checks against the live catalogue and REFUSES to record any
      # migration whose objects are absent, exiting non-zero — so a registry
      # entry that describes objects the migration does not actually create
      # fails here rather than being discovered during a deploy. `status` then
      # re-reads the whole ledger and fails on any remaining drift.
      - run: npm run migrations:record
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:56322/postgres
      - run: npm run migrations:status
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:56322/postgres
      - run: npm run test:rls
      # Phase 1 exit gate, database side. Applies the projection to the fresh
      # local Postgres and shadow-compares the rows against the bank, so
      # "1,293 items round-trip with matching hashes and no learner privilege
      # on the answer table" is proved against a real database on every push
      # rather than asserted. Runs after test:rls so a broken privilege model
      # is reported by the focused suite first.
      - run: npm run projection:apply
      - run: npm run projection:verify -- --live
      # Idempotency is a claim the script makes about itself; a second run
      # that inserts anything, or a comparison that then fails, disproves it.
      - run: npm run projection:apply
      - run: npm run projection:verify -- --live
      - if: always()
        run: supabase stop

  # Infra-heavy (a real browser) — kept as its own job for the same reason
  # as rls: a flaky Chromium launch or a slow browser download must never
  # block the required core signal.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
