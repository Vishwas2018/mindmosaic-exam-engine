<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics="">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=Geist:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#FCFBF8;color:#18151F;font-family:Geist,'Helvetica Neue',system-ui,sans-serif}
p{margin:0}
a{color:#5925A8;text-decoration:none}
a:hover{color:#5925A8}
</style>
</helmet>

<nav aria-label="Page navigation" style="background:#fff;border-top:1px solid #E9E4ED;border-bottom:1px solid #E9E4ED">
  <div style="max-width:1440px;margin:0 auto;padding:16px clamp(20px,4vw,64px);display:flex;flex-wrap:wrap;align-items:center;gap:12px">
    <button type="button" onClick="{{ goBack }}" style="display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:0 16px;border:1px solid #E9E4ED;border-radius:10px;background:#fff;font-family:inherit;font-size:14.5px;font-weight:600;color:#3D3846;cursor:pointer" style-hover="border-color:#5925A8;color:#5925A8"><span aria-hidden="true">←</span>Back</button>
    <a href="MindMosaic Landing.dc.html" style="display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:0 16px;border:1px solid #E9E4ED;border-radius:10px;background:#fff;font-size:14.5px;font-weight:600;color:#3D3846" style-hover="border-color:#5925A8;color:#5925A8"><span aria-hidden="true">⌂</span>Home</a>

    <div style="margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px">
      <sc-if value="{{ hasPrev }}" hint-placeholder-val="{{ true }}">
        <a href="{{ prevHref }}" style="display:grid;gap:2px;min-height:44px;padding:6px 16px;border:1px solid #E9E4ED;border-radius:10px;background:#fff;color:#18151F;text-align:right" style-hover="border-color:#5925A8">
          <span style="font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#625D69">Previous</span>
          <span style="font-size:14.5px;font-weight:700">{{ prevLabel }}</span>
        </a>
      </sc-if>
      <sc-if value="{{ hasNext }}" hint-placeholder-val="{{ true }}">
        <a href="{{ nextHref }}" style="display:grid;gap:2px;min-height:44px;padding:6px 18px;border:1px solid #5925A8;border-radius:10px;background:#5925A8;color:#fff" style-hover="background:#4A1E8D;color:#fff">
          <span style="font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;opacity:0.85">Next</span>
          <span style="font-size:14.5px;font-weight:700">{{ nextLabel }} →</span>
        </a>
      </sc-if>
    </div>
  </div>
  <div style="border-top:1px solid #F1EDF5">
    <div style="max-width:1440px;margin:0 auto;padding:12px clamp(20px,4vw,64px);display:flex;flex-wrap:wrap;align-items:center;gap:8px">
      <span style="font-size:11.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#928C99;margin-right:6px">All screens</span>
      <sc-for list="{{ all }}" as="a" hint-placeholder-count="8">
        <a href="{{ a.href }}" aria-current="{{ a.current }}" style="{{ a.style }}">{{ a.label }}</a>
      </sc-for>
      <a href="MindMosaic Log in.dc.html" style="display:inline-flex;align-items:center;min-height:38px;padding:0 13px;border-radius:9px;font-size:13.5px;font-weight:600;color:#3D3846;border:1px solid #E9E4ED" style-hover="border-color:#5925A8;color:#5925A8">Log in</a>
      <a href="MindMosaic Sign up.dc.html" style="display:inline-flex;align-items:center;min-height:38px;padding:0 13px;border-radius:9px;font-size:13.5px;font-weight:600;color:#3D3846;border:1px solid #E9E4ED" style-hover="border-color:#5925A8;color:#5925A8">Sign up</a>
    </div>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:80},&quot;here&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Home&quot;,&quot;Learn&quot;,&quot;Practice&quot;,&quot;Exam Preparation&quot;,&quot;How It Works&quot;,&quot;Plans&quot;,&quot;Resources&quot;,&quot;About&quot;],&quot;default&quot;:&quot;How It Works&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const order = [
      ['Home', 'MindMosaic Landing.dc.html'],
      ['Learn', 'MindMosaic Learn.dc.html'],
      ['Practice', 'MindMosaic Practice.dc.html'],
      ['Exam Preparation', 'MindMosaic Exam Preparation.dc.html'],
      ['How It Works', 'MindMosaic How It Works.dc.html'],
      ['Plans', 'MindMosaic Plans.dc.html'],
      ['Resources', 'MindMosaic Resources.dc.html'],
      ['About', 'MindMosaic About.dc.html']
    ];
    const i = order.findIndex(o => o[0] === (this.props.here || ''));
    const prev = i > 0 ? order[i - 1] : null;
    const next = i >= 0 && i < order.length - 1 ? order[i + 1] : null;
    const all = order.map(([label, href]) => ({
      label, href,
      current: label === (this.props.here || '') ? 'page' : undefined,
      style: 'display:inline-flex;align-items:center;min-height:38px;padding:0 13px;border-radius:9px;font-size:13.5px;font-weight:600;'
        + (label === (this.props.here || '')
          ? 'background:#F3EEFA;color:#5925A8'
          : 'color:#3D3846;border:1px solid #E9E4ED')
    }));
    return {
      all,
      hasPrev: !!prev,
      hasNext: !!next,
      prevLabel: prev ? prev[0] : '',
      prevHref: prev ? prev[1] : '#',
      nextLabel: next ? next[0] : '',
      nextHref: next ? next[1] : '#',
      goBack: () => { if (window.history.length > 1) window.history.back(); else window.location.href = 'MindMosaic Landing.dc.html'; }
    };
  }
}
</script>
</body>
</html>
