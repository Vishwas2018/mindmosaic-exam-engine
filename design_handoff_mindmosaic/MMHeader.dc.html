<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=Geist:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#FCFBF8;color:#18151F;font-family:Geist,'Helvetica Neue',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#5925A8;text-decoration:none}
a:hover{color:#5925A8}
</style>
</helmet>

<header style="background:rgba(252,251,248,0.95);border-bottom:1px solid #E9E4ED">
  <div style="max-width:1440px;margin:0 auto;padding:0 clamp(20px,4vw,64px);height:76px;display:flex;align-items:center;gap:clamp(16px,3vw,36px)">
    <a href="MindMosaic Landing.dc.html" aria-label="MindMosaic home" style="display:flex;align-items:center;gap:11px;flex:none">
      <span aria-hidden="true" style="width:38px;height:38px;flex:none;background-image:url('assets/logo-brain.png');background-size:290% auto;background-position:50% 46%;background-repeat:no-repeat"></span>
      <span style="font-family:'Instrument Sans',sans-serif;font-weight:800;font-size:19px;letter-spacing:-0.03em"><span style="color:#5925A8">Mind</span><span style="color:#FF555A">Mosaic</span></span>
    </a>

    <nav aria-label="Primary" style="display:flex;align-items:center;gap:clamp(10px,1.4vw,22px);margin-left:6px">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="7">
        <a href="{{ l.href }}" aria-current="{{ l.current }}" style="{{ l.style }}" style-hover="color:#5925A8">{{ l.label }}</a>
      </sc-for>
    </nav>

    <div style="margin-left:auto;display:flex;align-items:center;gap:clamp(8px,1.4vw,16px)">
      <a href="MindMosaic Log in.dc.html" style="display:inline-flex;align-items:center;min-height:40px;padding:0 8px;font-size:14.5px;font-weight:600;color:#18151F" style-hover="color:#5925A8">Log in</a>
      <a href="MindMosaic Sign up.dc.html" style="display:inline-flex;align-items:center;min-height:40px;padding:0 clamp(16px,1.8vw,24px);background:#5925A8;color:#fff;border-radius:10px;font-size:14.5px;font-weight:700;letter-spacing:-0.01em;white-space:nowrap" style-hover="background:#4A1E8D;color:#fff">Start free</a>
    </div>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:80},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;learn&quot;,&quot;practice&quot;,&quot;exam&quot;,&quot;how&quot;,&quot;plans&quot;,&quot;resources&quot;,&quot;about&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || '';
    const base = 'display:inline-flex;align-items:center;min-height:44px;font-size:14.5px;font-weight:600;';
    const items = [
      ['learn', 'Learn', 'MindMosaic Learn.dc.html'],
      ['practice', 'Practice', 'MindMosaic Practice.dc.html'],
      ['exam', 'Exam Preparation', 'MindMosaic Exam Preparation.dc.html'],
      ['how', 'How It Works', 'MindMosaic How It Works.dc.html'],
      ['plans', 'Plans', 'MindMosaic Plans.dc.html'],
      ['resources', 'Resources', 'MindMosaic Resources.dc.html'],
      ['about', 'About', 'MindMosaic About.dc.html']
    ];
    return {
      links: items.map(([id, label, href]) => ({
        label, href,
        current: id === active ? 'page' : undefined,
        style: base + (id === active
          ? 'color:#5925A8;box-shadow:inset 0 -2px 0 #FF555A'
          : 'color:#3D3846')
      }))
    };
  }
}
</script>
</body>
</html>
